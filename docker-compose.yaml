# 使用 fork 发布到 Docker Hub 的镜像：docker compose up -d
services:
  octopus:
    image: mukmiuikong/octopus:latest
    ports:
      - "127.0.0.1:20001:8080"
    volumes:
      - "./data:/app/data"
    container_name: octopus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

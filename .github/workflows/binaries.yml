name: Build Binaries

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
    # 与 dockerhub.yml 的 paths 完全一致，保证镜像与二进制构建源同步。
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "static/**"
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "scripts/dockerfiles/entrypoint.sh"
      - "scripts/build.sh"
      - "scripts/updatePrice.py"
      - ".github/workflows/dockerhub.yml"
      - ".github/workflows/binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve latest AxonHub module
        run: go get github.com/looplj/axonhub/llm@unstable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "latest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build binaries
        run: bash scripts/build.sh release

      - name: Verify all platform archives
        run: |
          expected=(
            "build/archives/octopus-linux-x86_64.zip"
            "build/archives/octopus-linux-arm64.zip"
            "build/archives/octopus-linux-armv7.zip"
            "build/archives/octopus-linux-x86.zip"
            "build/archives/octopus-windows-x86_64.zip"
            "build/archives/octopus-windows-x86.zip"
            "build/archives/octopus-darwin-arm64.zip"
            "build/archives/octopus-darwin-x86_64.zip"
          )
          for f in "${expected[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing build artifact: $f"
              exit 1
            fi
          done
          if [[ ! -f "build/bin/md5.txt" ]]; then
            echo "::error::Missing checksum file: build/bin/md5.txt"
            exit 1
          fi
          echo "All ${#expected[@]} platform archives and checksums present"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: octopus-checksums
          path: build/bin/md5.txt
          if-no-files-found: error

      - name: Upload linux-x86_64
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-x86_64
          path: build/archives/octopus-linux-x86_64.zip
          if-no-files-found: error

      - name: Upload linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-arm64
          path: build/archives/octopus-linux-arm64.zip
          if-no-files-found: error

      - name: Upload linux-armv7
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-armv7
          path: build/archives/octopus-linux-armv7.zip
          if-no-files-found: error

      - name: Upload linux-x86
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-x86
          path: build/archives/octopus-linux-x86.zip
          if-no-files-found: error

      - name: Upload windows-x86_64
        uses: actions/upload-artifact@v4
        with:
          name: octopus-windows-x86_64
          path: build/archives/octopus-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload windows-x86
        uses: actions/upload-artifact@v4
        with:
          name: octopus-windows-x86
          path: build/archives/octopus-windows-x86.zip
          if-no-files-found: error

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: octopus-darwin-arm64
          path: build/archives/octopus-darwin-arm64.zip
          if-no-files-found: error

      - name: Upload darwin-x86_64
        uses: actions/upload-artifact@v4
        with:
          name: octopus-darwin-x86_64
          path: build/archives/octopus-darwin-x86_64.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="octopus-binaries"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NOTES="Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if gh release view "${RELEASE_TAG}" --json tagName >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists, updating"
            # Move tag to current commit and refresh all assets
            git push origin "${GITHUB_SHA}:refs/tags/${RELEASE_TAG}" --force
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes >/dev/null
            done
            gh release upload "${RELEASE_TAG}" build/archives/*.zip build/bin/md5.txt --clobber
            gh release edit "${RELEASE_TAG}" --title "Octopus ${VERSION}" --notes "${NOTES}"
          else
            echo "Release ${RELEASE_TAG} not found, creating"
            gh release create "${RELEASE_TAG}" build/archives/*.zip build/bin/md5.txt \
              --title "Octopus ${VERSION}" --notes "${NOTES}" \
              --target "${GITHUB_SHA}"
          fi
